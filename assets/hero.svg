<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">Movement, measured. Health, understood.</title>
  <desc id="desc">An original abstract banner with curved movement traces and sensor points on a dark blue background.</desc>
